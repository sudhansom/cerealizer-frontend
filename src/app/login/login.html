@if (!loggedIn()) {
  <div class="shadow">
    <div class="modal1">
      <div class="login-modal">
        <p class="heading">Login</p>
      </div>
      <div class="modal-body">
        <label
          >User:
          <input class="user" type="text" [(ngModel)]="username" />
        </label>
        <label
          >Password:
          <input class="password" type="password" [(ngModel)]="password" />
        </label>
      </div>
      <div class="footer">
        <button (click)="submitForm()">Login</button>
      </div>
    </div>
  </div>
}
