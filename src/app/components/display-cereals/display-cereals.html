<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
      <h5 class="mb-0 fw-bold">Cereal List</h5>

      <app-cereal-search (search)="onSearch($event)" />

      <div class="btn-group">
        <button
          type="button"
          class="btn btn-sm btn-outline-primary"
          [disabled]="!isLoggedIn()"
          [title]="isLoggedIn() ? 'Add a new cereal' : 'Log in to add cereals'"
          (click)="openAdd()"
        >
          Add Cereal
        </button>
      </div>
    </div>

    <app-cereal-table
      [cereals]="cereals"
      [isLoggedIn]="isLoggedIn()"
      (sortChange)="onSort($event)"
      (cellChange)="onCellChange($event)"
      (deleteRow)="onDelete($event)"
      (editRow)="openEdit($event)"
    />
  </div>
</div>

@if (modalMode(); as mode) {
  <app-cereal-form-dialog
    [mode]="mode"
    [initial]="editingCereal()"
    (submitForm)="onSubmit($event)"
    (cancel)="closeModal()"
  />
}
