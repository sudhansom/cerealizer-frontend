<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
      <div>
        <h5 class="mb-0 fw-bold">Cereal List</h5>
      </div>
      <div>
        <h5 class="text-center">Search</h5>
        <div class="search d-flex justify-content-between gap-1">
          <select class="form-select" [(ngModel)]="item" (ngModelChange)="onChangeItem()">
            <option value="">Item</option>
            @for (title of titles; track title.slice(0, 3)) {
              @if (!['S.N', 'Image'].includes(title)) {
                <option [value]="title">{{ title }}</option>
              }
            }
          </select>
          <select class="form-select p-1" [(ngModel)]="condition">
            <option value="">Condition</option>
            @if (!checkCondition()) {
              <option class="fs-1 fw-bold" value="greaterThan">></option>
              <option class="fs-1 fw-bold" value="lessThan"><</option>
              <option class="fs-1 fw-bold" value="equalTo">=</option>
              <option class="fs-1 fw-bold" value="greaterThanOrEqualto">>=</option>
              <option class="fs-1 fw-bold" value="lessThanOrEqualto"><=</option>
              <option class="fs-1 fw-bold" value="notEqualTo">!=</option>
            }
            @if (checkCondition()) {
              <option class="fs-1 fw-bold" value="equalTo">=</option>

              <option class="fs-1 fw-bold" value="notEqualTo">!=</option>
            }
          </select>
          <input
            class="w-25 search-input p-1"
            [type]="checkCondition() ? 'text' : 'number'"
            placeholder="Value"
            [title]="'Enter Text Value'"
            (change)="onChangeItem()"
            [(ngModel)]="value"
          />
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-sm btn-outline-primary" (click)="addCereal()">
          {{ addNewCereal ? 'Save' : 'Add Cereal' }}
        </button>
      </div>
    </div>
    @if (addNewCereal) {
      <div class="row p-2">
        <form class="form" [formGroup]="cerealForm">
          <div class="col p-1">{{ cereals.length }}</div>
          @for (titleValue of titleValues; track titleValue) {
            <div class="col">
              <input
                class="form-control w-full p-1"
                [type]="['name', 'mfr', 'type'].includes(titleValue.toString()) ? 'text' : 'number'"
                [formControlName]="titleValue"
                [class.field-name]="titleValue.toString() === 'name'"
                [placeholder]="titleValue.toString()"
              />
            </div>
          }
        </form>
      </div>
    }
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-striped mb-0">
          <thead class="table-light">
            <tr>
              @for (title of titles; track title.slice(2, 6)) {
                <th>{{ title }}</th>
              }
            </tr>
          </thead>
          <tbody>
            @for (cereal of cereals; track cereal.id) {
              <tr>
                <td>
                  <!-- <span class="hide-on-hover">{{ $index }} </span> -->
                  <button
                    class="btn btn-sm btn-outline-danger btn-custom-border"
                    (click)="deleteCereal(cereal.id)"
                  >
                    {{ $index }}
                  </button>
                </td>
                @for (titleValue of titleValues; track titleValue) {
                  <td>
                    <input
                      class="form-control w-full border-0 bg-transparent p-0"
                      [class.bg-light]="!isFocused"
                      (focus)="isFocused = true"
                      (blur)="isFocused = false"
                      [class.w-auto]="titleValue.toString() === 'name'"
                      type="text"
                      [value]="cereal[titleValue]"
                      (change)="updateCereal($event, cereal.id, titleValue.toString())"
                    />
                  </td>
                }

                <!-- <td>
                  <button class="btn btn-sm btn-primary me-1">Edit</button>
                  <button class="btn btn-sm btn-danger">Delete</button>
                </td> -->
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
